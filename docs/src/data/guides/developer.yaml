# The Start here page of the developer docs, /api/start/
#
# Each entry is a node, listed by its id:
# - question: a question and its answers. Each answer leads to another node with `to`.
# - guide: a quick guide page under api/quick/ (`page` is its slug, `anchor` an optional section).
# - link: any other page of the docs, like the user guide (`page`, and optionally `anchor`).
#
# Only questions are cards: an answer leading to a guide or a link opens its page directly.
# `label` names the node, a question shows it in the trail on top of its card. The answers
# show the `label` of each answer instead, written as a choice. `related` lists the nodes
# shown as "You may also need" at the bottom of a quick guide.
#
# Each node has one parent: only one answer can lead to it. When a quick guide fits two places,
# give it two nodes with the same `page`. Its "Back to Start here" link goes to the question of
# the first one met from `start`, in the order of the answers.
#
# A guide can be at most 4 answers away from `start`. The build stops with a message naming
# the node when something is wrong.
#
# Never rename a question id: people share links like /api/start/#no-chat.

start:
  type: question
  label: Start
  question: What are you working on?
  help: "Pick the closest one."
  answers:
    - label: I want my rolls to show 3D dice
      hint: a game system, a module or a macro
      to: rolls
    - label: I want to change how the dice look
      hint: colors, faces, 3D models, effects
      to: looks
    - label: I want my code to react to Dice So Nice!
      hint: hooks, events, timing
      to: react
    - label: I have a problem with the dice
      hint: dice missing, shown twice, shown too early...
      to: troubleshooting
    - label: I'm new here and want to know how it works
      to: how-it-works
    - label: I want the list of flags and options
      to: cheat-sheet

rolls:
  type: question
  label: Show dice for my rolls
  question: Does the roll end up in a chat message?
  help: "That's what `roll.toMessage()` and `ChatMessage.create({ rolls })` do."
  answers:
    - label: Yes, it's posted as a chat message
      to: chat
    - label: No, there's no chat message for it
      hint: a reroll in a chat message, a save stored in flags...
      to: no-chat
    - label: I'm writing a macro
      to: macros
    - label: Not sure
      to: not-sure-rolls

chat:
  type: question
  label: In a chat message
  question: Anything special about these rolls?
  answers:
    - label: No, they are regular rolls
      to: chat-rolls
    - label: I split one roll across several chat messages
      to: several-messages
    - label: I also show the result in another chat message
      to: result-in-message
    - label: I want some dice to roll after others
      to: roll-order
    - label: I put the rolls of several characters in one message
      to: several-actors
    - label: I want a new type of die
      hint: a new DiceTerm, like `/r 2dx`
      to: own-die
    - label: I don't want some rolls or dice to be animated
      to: skip
    - label: I want players to throw the dice by hand
      to: interactive

no-chat:
  type: question
  label: No chat message
  question: What do you have to show?
  answers:
    - label: I have an evaluated Foundry Roll
      to: have-roll
    - label: I only have results from my own random system
      to: no-roll-class

have-roll:
  type: question
  label: I have a Roll
  question: Who should see the dice?
  answers:
    - label: The people who can see a chat message I have
      to: animate-roll-message
    - label: A chat mode, like public, GM only, blind or self
      to: animate-roll-mode
    - label: I want to pick the users myself
      to: show-for-roll

